<!doctype html>
<html lang="ja">
<head>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-NNLTJRF5');</script>
  <!-- End Google Tag Manager -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="建物の3Dモデル内を自由移動・歩行できるインタラクティブビューア">
  <title>GANKYU — 3D WALK</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="player-controls.css">
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NNLTJRF5"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <main id="viewport">
    <canvas id="scene" aria-label="建物の3Dウォークスルー"></canvas>

    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span><div><p>ARCHITECTURE / 3D VIEWER</p><h1>GANKYU</h1></div></div>
      <div class="mode-switch" role="group" aria-label="移動モード">
        <button class="mode active" data-mode="walk" aria-pressed="true"><span>01</span> 歩行</button>
        <button class="mode" data-mode="fly" aria-pressed="false"><span>02</span> 自由移動</button>
      </div>
    </header>

    <div class="loading" id="loading"><div class="loader-line"><i id="progress"></i></div><p>MODEL LOADING <span id="percent">0</span>%</p></div>

    <section class="intro" id="intro">
      <p class="intro-kicker">VIRTUAL SITE VISIT</p>
      <h2>建築の内部へ。</h2>
      <p>クリックして探索を開始</p>
      <button id="start" type="button">ENTER <span>→</span></button>
    </section>

    <div class="crosshair" aria-hidden="true"><i></i></div>

    <aside class="info-panel">
      <div><small>MODE</small><strong id="modeLabel">WALK</strong></div>
      <div><small>HEIGHT</small><strong id="heightLabel">0.0 M</strong></div>
      <div class="coordinates"><small>POSITION / X · Y · Z</small><strong id="positionLabel">0.00 · 0.00 · 0.00</strong></div>
      <div><small>STATUS</small><strong id="statusLabel"><i></i> READY</strong></div>
    </aside>

    <aside class="scale-panel">
      <label for="playerHeight"><span>PLAYER HEIGHT</span><span class="value-input"><input id="playerHeight" type="number" min="0.001" max="100" step="0.001" value="0.035" inputmode="decimal" aria-label="プレイヤーの絶対高さ"><b>M</b></span></label>
      <label for="moveSpeed"><span>MOVE SPEED</span><span class="value-input"><input id="moveSpeed" type="number" min="0.001" max="1000" step="0.001" value="0.200" inputmode="decimal" aria-label="移動速度"><b>M/S</b></span></label>
      <p>モデル座標上の絶対値 ／ 秒</p>
    </aside>

    <aside class="controls" id="controls">
      <p>操作方法</p>
      <div><span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><b>移動</b></div>
      <div><span class="mouse">＋</span><b>視点</b></div>
      <div id="verticalGuide"><span class="keys"><kbd>Space</kbd><kbd>Shift</kbd></span><b>上下</b></div>
      <div><span class="keys"><kbd>F</kbd></span><b>モード切替</b></div>
    </aside>

    <button class="reset" id="reset" type="button">↻ <span>開始位置へ</span></button>
    <div class="hint" id="hint">クリックでマウス操作を再開</div>
  </main>

  <footer><span>hakusen</span><a href="https://hakusenkinpan.github.io/policy/">プライバシーポリシー</a></footer>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <script type="module" src="app.js"></script>
</body>
</html>
