<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#100d0a" />
    <title>居合斬り測定</title>
    <meta name="description" content="スマートフォンを振って、一閃の威力を測定するミニゲーム" />
    <link rel="stylesheet" href="style.css" />
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="game scene-title">
      <div class="grain" aria-hidden="true"></div>
      <div class="sun" aria-hidden="true"></div>
      <div class="slash-line" aria-hidden="true"></div>

      <section class="panel title-panel" id="titleScene" aria-labelledby="gameTitle">
        <p class="eyebrow">一閃に、すべてを懸けろ</p>
        <h1 id="gameTitle"><span>居合斬り</span><strong>測定</strong></h1>
        <div class="rule"></div>
        <p class="lead">スマートフォンをしっかり握り、<br />合図にあわせて一気に振り抜け。</p>
        <div class="safety"><span aria-hidden="true">!</span>周囲の安全を確認し、端末を落とさないようご注意ください</div>
        <button class="primary-button" id="startButton" type="button"><span>測定開始</span><small>いざ、尋常に</small></button>
        <p class="error-message" id="errorMessage" hidden></p>
        <p class="sound-note">音量を上げてお楽しみください</p>
      </section>

      <section class="panel action-panel" id="readyScene" aria-live="polite" hidden>
        <p class="eyebrow">精神を研ぎ澄ませ</p>
        <h2>構えてください</h2>
        <div class="countdown" id="countdown">3</div>
        <p class="instruction">合図が鳴ったら、鋭く振り抜け</p>
        <div class="progress"><span></span></div>
      </section>

      <section class="panel action-panel measuring" id="measureScene" aria-live="assertive" hidden>
        <p class="eyebrow">今こそ放て</p>
        <h2>斬れ！</h2>
        <div class="motion-ring"><div id="motionMeter"></div><span>一閃</span></div>
        <p class="instruction">スマートフォンを振り抜け</p>
      </section>

      <section class="panel result-panel" id="resultScene" aria-live="polite" hidden>
        <p class="eyebrow">今回の記録</p>
        <h2>威力</h2>
        <div class="score"><strong id="power">0</strong><span>斬</span></div>
        <p class="rank" id="rank">見習い剣士</p>
        <div class="result-actions">
          <button class="primary-button" id="retryButton" type="button"><span>もう一度</span><small>記録に挑む</small></button>
          <button class="text-button" id="titleButton" type="button">タイトルに戻る</button>
        </div>
      </section>
      <footer>IAI POWER MEASUREMENT</footer>
    </main>
  </body>
</html>
