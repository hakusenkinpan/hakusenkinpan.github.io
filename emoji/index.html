<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060817">
  <title>MOCHI SPACE — ぷにぷに3D絵文字</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <canvas id="space" aria-label="弾力のある3D絵文字を操作する宇宙空間"></canvas>

    <header class="emoji-dock" aria-label="絵文字を追加">
      <button class="emoji-choice active" data-emoji="🥺" aria-label="うるうる顔を追加">🥺</button>
      <button class="emoji-choice" data-emoji="😡" aria-label="怒った顔を追加">😡</button>
      <button class="emoji-choice" data-emoji="🤓" aria-label="眼鏡の顔を追加">🤓</button>
      <button class="emoji-choice" data-emoji="😭" aria-label="泣いた顔を追加">😭</button>
      <button class="emoji-choice" data-emoji="🤔" aria-label="考える顔を追加">🤔</button>
    </header>

    <section class="intro" id="intro" aria-hidden="true">
      <p>DRAG · POKE · PLAY</p>
      <h1>MOCHI<br>SPACE</h1>
      <span>ぷにっと触ってみて</span>
    </section>

    <aside class="status">
      <span id="toolName">指</span>
      <span class="divider"></span>
      <span id="objectCount">1 MOCHI</span>
    </aside>

    <footer class="tool-dock" aria-label="道具を選択">
      <button class="tool active" data-tool="finger" aria-label="指">
        <span class="icon">☝️</span><small>指</small>
      </button>
      <button class="tool" data-tool="flick" aria-label="弾き">
        <span class="icon">🫰</span><small>弾き</small>
      </button>
      <button class="tool" data-tool="gun" aria-label="銃">
        <span class="icon">🔫</span><small>銃</small>
      </button>
      <button class="tool" data-tool="knife" aria-label="ナイフ">
        <span class="icon">🔪</span><small>ナイフ</small>
      </button>
      <button class="tool reset" data-tool="reset" aria-label="リセット">
        <span class="icon">↩</span><small>リセット</small>
      </button>
    </footer>

    <div id="crosshair" aria-hidden="true"><i></i><i></i></div>
    <div id="toast" role="status"></div>
    <div class="grain" aria-hidden="true"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
